# CodeMaster 270M Training Configuration

model:
  name: codemaster-270m
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  hidden_act: "gelu"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 2048
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12
  pad_token_id: 50256
  eos_token_id: 50256
  bos_token_id: 50256

training:
  epochs: 3
  batch_size: 512
  gradient_accumulation_steps: 64
  learning_rate: 5.0e-4
  warmup_steps: 10000
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_workers: 4
  seed: 42
  mixed_precision: "fp16"

optimization:
  optimizer: "adamw"
  scheduler: "cosine"
  num_cycles: 0.5
  last_epoch: -1

data:
  dataset_name: "the_stack"
  train_split: 0.95
  val_split: 0.025
  test_split: 0.025
  max_seq_length: 2048
  preprocessing_num_workers: 4

languages:
  - python
  - javascript
  - typescript
  - java
  - cpp
  - csharp
  - go
  - rust
  - ruby
  - php
  - swift
  - kotlin

logging:
  log_level: "INFO"
  log_dir: "./logs"
  log_interval: 100
  eval_interval: 5000
  save_interval: 10000
  use_wandb: false
  wandb_project: "codemaster-270m"

inference:
  device: "cuda"
  dtype: "float16"
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  num_beams: 1
  do_sample: true

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 5
  save_best_only: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  load_best_model_at_end: true
